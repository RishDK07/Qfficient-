name: CI

on:
  push:
    branches: [ main, research-grade ]
  pull_request:
    branches: [ main, research-grade ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install openjij dimod dwave-neal pandapower pytest

    - name: Run Test Suite
      run: |
        pytest tests/ -v

    - name: Verify Report and Telemetry Consistency
      run: |
        python -c "
        import json
        with open('results/benchmark_summary.json') as f:
            d = json.load(f)
        assert 'standard_static' in d
        assert 'loss_optimal_candidate_search' in d
        print('Benchmark telemetry integrity confirmed.')
        "
